name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            archive: OpenVINO-Studio-Windows.zip
          - os: macos-latest
            name: macOS
            archive: OpenVINO-Studio-macOS.zip
          - os: ubuntu-latest
            name: Linux
            archive: OpenVINO-Studio-Linux.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/"OpenVINO Studio"
          cp -R app dist/"OpenVINO Studio"/
          cp -R launchers dist/"OpenVINO Studio"/
          cp LICENSE README.md THIRD_PARTY_NOTICES.txt dist/"OpenVINO Studio"/
          if [ "${{ matrix.name }}" = "Windows" ]; then
            cp "OpenVINO Studio.vbs" "Create Desktop Shortcut.vbs" dist/"OpenVINO Studio"/
            cp README.txt dist/"OpenVINO Studio"/README-Windows.txt
          fi
          find dist -name "__pycache__" -type d -prune -exec rm -rf {} + || true
          find dist -name ".DS_Store" -delete || true
          find dist -name "._*" -delete || true
          mkdir -p dist/"OpenVINO Studio"/models dist/"OpenVINO Studio"/runtime
          touch dist/"OpenVINO Studio"/models/.gitkeep dist/"OpenVINO Studio"/runtime/.gitkeep

      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ matrix.name }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path 'OpenVINO Studio' -DestinationPath '${{ matrix.archive }}' -Force"
          elif [ "${{ matrix.name }}" = "macOS" ]; then
            chmod +x "OpenVINO Studio/launchers/macos/OpenVINO Studio.app/Contents/MacOS/OpenVINO Studio"
            zip -r -q "${{ matrix.archive }}" "OpenVINO Studio"
          else
            chmod +x "OpenVINO Studio/launchers/linux/"*.sh
            tar -czf "${{ matrix.archive }}" "OpenVINO Studio"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
